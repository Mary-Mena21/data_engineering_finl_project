# docker-compose.yml
services:
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.8
    container_name: final_rustfs_self-study
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_final_data_self-study:/data
    command: ["/data"]
    restart: unless-stopped

  # Downloads the community DuckDB driver jar into a shared volume once,
  # before Metabase starts. Pinned to the DuckDB version dbt-duckdb uses
  # (see uv.lock) so the JDBC driver can open warehouse.duckdb.
  metabase-driver-init:
    image: curlimages/curl:8.11.1
    container_name: final_metabase_driver_init_self-study
    volumes:
      - metabase_plugins:/plugins
    entrypoint: ["sh", "-c", "curl -sSL -o /plugins/duckdb.metabase-driver.jar https://github.com/motherduckdb/metabase_duckdb_driver/releases/download/1.5.4.0/duckdb.metabase-driver.jar"]
    restart: "no"

  metabase:
    # Pinned to match the "Metabase 62" build the DuckDB driver above targets.
    # Built from metabase.Dockerfile to add libstdc++/gcompat, which the
    # DuckDB driver's native library needs but the base Alpine image lacks.
    build:
      context: .
      dockerfile: metabase.Dockerfile
    container_name: final_metabase_self-study
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
      - metabase_plugins:/plugins
      - ./data:/data:ro
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_PLUGINS_DIR: /plugins
    depends_on:
      metabase-driver-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  rustfs_final_data_self-study:
    driver: local
  metabase_data:
    driver: local
  metabase_plugins:
    driver: local